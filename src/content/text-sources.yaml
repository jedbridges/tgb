# Where each public domain text comes from. Read by scripts/fetch-texts.ts.
#
#   work:       the work slug in src/content/works
#   source:     standardebooks | gutenberg
#   url:        the Standard Ebooks book page, or the Gutenberg book number
#   edition:    what a reader is being given, named honestly (translator, year)
#   translator: as the work's recommendedEdition uses it, when the text is a translation
#   match:      a regular expression on the heading path, for a volume holding several works
#
# The first batch: the works most programs assign whose originals or older translations
# are public domain, chosen so the page design can be reviewed on epic, drama, dialogue,

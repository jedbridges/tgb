name: Thomas Aquinas College
shortName: Thomas Aquinas
kind: college
institution: Thomas Aquinas College (Santa Paula, California and Northfield, Massachusetts)
url: https://www.thomasaquinas.edu/a-liberating-education/syllabus
description: >-
  Thomas Aquinas College is a Catholic liberal arts college founded in 1971 in Santa Paula, California, with a
  second campus in Northfield, Massachusetts, opened in 2019. Every student follows the same four-year
  curriculum, which has no majors, electives, or textbooks: all classes are discussions of primary sources, led
  by tutors using the Socratic method, and the whole program is ordered toward theology as the highest science,
  with the works of Aristotle and St. Thomas Aquinas as its backbone.

  The curriculum consists of a four-year Seminar in literature, history, and philosophy, plus tutorials in
  theology (four years), philosophy (three years), mathematics (four years), natural science (four years),
  language (two years of Latin), and music (one year). The list below gives the Seminar readings for each year
  first, followed by the theology, philosophy, and principal mathematics and natural science readings, each
  marked in the note. Laboratory manuals, grammar primers, and collections of scientific papers are omitted.
sourceNote: "Thomas Aquinas College Syllabus (list of works read in whole or in part), https://www.thomasaquinas.edu/a-liberating-education/syllabus, current curriculum, checked 2026-09-21"

name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # full history: the sitemap's lastmod and dateModified come from git
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:content
      - run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          BOOKSHOP_AFFILIATE_ID: ${{ secrets.BOOKSHOP_AFFILIATE_ID }}
          PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
          PUBLIC_BUTTONDOWN_USER: ${{ secrets.PUBLIC_BUTTONDOWN_USER }}
      - name: Sync the corpus to R2 for AI Search
        # A failed sync leaves Ask answering from the last corpus; it must never stop the
        # site itself from deploying. The failure still shows as an annotation on the run.
        continue-on-error: true
        # Skipped until both R2 secrets exist, so the deploy never fails on setup. GitHub
        # rejects the secrets context inside `if:`, which made the whole workflow invalid,
        # so the check reads them from the environment in the shell instead.
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets not set; corpus sync skipped"; exit 0
          fi
          npm run corpus && npm run corpus:sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Give the Worker the newsletter key
        # The signup endpoint needs the key at runtime and the Thursday job needs the same
        # key as a repo secret. Pushing it from here means it is stored in one place, not
        # two that can drift. Same shape as the corpus step above: absent means skipped,
        # and the signup form quietly keeps using its plain-form fallback.
        run: |
          if [ -z "$BUTTONDOWN_API_KEY" ]; then
            echo "BUTTONDOWN_API_KEY not set; inline signup stays on its plain form fallback"; exit 0
          fi
          printf '%s' "$BUTTONDOWN_API_KEY" | npx wrangler secret put BUTTONDOWN_API_KEY
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke the live site
        run: |
          curl -fsS -o /dev/null "${{ secrets.SITE_URL }}/"
          curl -fsS -o /dev/null "${{ secrets.SITE_URL }}/sitemap-index.xml"
      - name: Tell Bing and the answer engines what changed
        # Only pages whose lastmod is within the last few days; a full resubmission every
        # deploy would be noise. Never fails the deploy.
        run: npx tsx scripts/indexnow.ts --send --days 3 || true

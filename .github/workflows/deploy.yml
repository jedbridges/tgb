name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # full history: the sitemap's lastmod and dateModified come from git
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:content
      - run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          BOOKSHOP_AFFILIATE_ID: ${{ secrets.BOOKSHOP_AFFILIATE_ID }}
          PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}
      - name: Sync the corpus to R2 for AI Search
        # Skipped until both R2 secrets exist, so the deploy never fails on setup. GitHub
        # rejects the secrets context inside `if:`, which made the whole workflow invalid,
        # so the check reads them from the environment in the shell instead.
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2 secrets not set; corpus sync skipped"; exit 0
          fi
          npm run corpus && npm run corpus:sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke the live site
        run: |
          curl -fsS -o /dev/null "${{ secrets.SITE_URL }}/"
          curl -fsS -o /dev/null "${{ secrets.SITE_URL }}/sitemap-index.xml"
      - name: Tell Bing and the answer engines what changed
        # Only pages whose lastmod is within the last few days; a full resubmission every
        # deploy would be noise. Never fails the deploy.
        run: npx tsx scripts/indexnow.ts --send --days 3 || true
